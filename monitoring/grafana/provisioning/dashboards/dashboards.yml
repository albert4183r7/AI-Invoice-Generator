apiVersion: 1

providers:
  - name: Invoice API
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    # Re-read the dashboard JSON every 30s, so editing the file in the repo and
    # restarting is enough -- no clicking around in the UI.
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
