server {
    # 8080, not 80: the unprivileged image runs as a non-root uid and cannot
    # bind a privileged port. Compose maps host :80 onto this.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container / load balancer probe. Kept out of the access log so a probe
    # firing every few seconds doesn't drown out real traffic.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Vite emits content-hashed filenames, so a changed file gets a new name
    # rather than a new version of the same one -- safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: if a client holds a stale index it keeps
    # requesting asset filenames the new deploy has already deleted.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
