# Included by every location block that sets its own `add_header`.
#
# nginx does NOT merge `add_header` across levels: if a location declares even
# one add_header, it drops every add_header inherited from the server block.
# Since the cache-control locations below must set their own, these have to be
# repeated (via include) or they silently disappear from the responses that
# matter most -- the HTML.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
