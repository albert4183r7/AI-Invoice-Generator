name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required to push to GitHub Container Registry (GHCR).
  packages: write

jobs:
  publish:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend/invoice-generator

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR accepts the ephemeral workflow token, so there are no
          # long-lived registry credentials to store or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase in image paths, and this repo is named
      # "AI-Invoice-Generator" -- lowercasing is mandatory, not cosmetic.
      - name: Resolve lowercase image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The frontend's API URL is compiled into the bundle at build time,
      # so it comes from a repository variable (Settings -> Variables).
      - name: Resolve build args
        id: build
        run: |
          if [ "${{ matrix.image }}" = "frontend" ]; then
            echo "args=VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:5000' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.prefix }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
